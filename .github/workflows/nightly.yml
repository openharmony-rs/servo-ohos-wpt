name: Nightly

on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:
    inputs:
      servo-ref:
        description: servo-ohos branch, tag or commit to test
        default: ohos-main
        type: string
      force:
        description: Test even if the revision already has a run, and replace today's runs
        default: false
        type: boolean

permissions: {}

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  date:
    name: Date of the run
    runs-on: ubuntu-24.04
    outputs:
      date: ${{ steps.date.outputs.date }}
    steps:
      - id: date
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"

  linux-spidermonkey:
    name: Linux, SpiderMonkey
    needs: date
    uses: ./.github/workflows/run-linux.yml
    permissions:
      contents: write
    with:
      config: linux-spidermonkey
      date: ${{ needs.date.outputs.date }}
      servo-ref: ${{ inputs.servo-ref || 'ohos-main' }}
      force: ${{ inputs.force || false }}

  publish:
    name: Publish
    needs: linux-spidermonkey
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/publish.yml
    permissions:
      contents: read
      pages: write
      id-token: write
