name: Run WPT on Linux

# Builds servoshell from a servo-ohos revision, runs WPT in chunks and stores
# the merged result as refs/runs/<config>/<date>. Revisions that already have a
# run of this configuration are skipped, unless `force` is set.
on:
  workflow_call:
    inputs:
      config:
        description: Configuration name, used in refs/runs/<config>/<date>
        required: true
        type: string
      date:
        description: Date of the run (YYYY-MM-DD)
        required: true
        type: string
      servo-repository:
        default: openharmony-rs/servo-ohos
        type: string
      servo-ref:
        default: ohos-main
        type: string
      quickjs:
        description: Build with `--js-engine quickjs`, on the servo-quickjs commit that the revision pins
        default: false
        type: boolean
      build-args:
        description: Extra arguments for `./mach build`
        default: ""
        type: string
      wpt-args:
        description: Extra arguments for `./mach test-wpt`
        default: ""
        type: string
      chunks:
        default: 20
        type: number
      force:
        description: Test even if the revision already has a run, and replace a run of the same date
        default: false
        type: boolean

permissions: {}

env:
  RUST_BACKTRACE: 1
  SHELL: /bin/bash
  WPT_CLI_VERSION: 0.1.1

jobs:
  check:
    name: Check for an existing run
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.check.outputs.sha }}
      skip: ${{ steps.check.outputs.skip }}
      chunks: ${{ steps.check.outputs.chunks }}
    steps:
      - uses: actions/checkout@v6
      - name: Resolve the revision and look for a run of it
        id: check
        env:
          CONFIG: ${{ inputs.config }}
          REPOSITORY: ${{ inputs.servo-repository }}
          REF: ${{ inputs.servo-ref }}
          FORCE: ${{ inputs.force }}
          CHUNKS: ${{ inputs.chunks }}
        run: |
          if [[ "$REF" =~ ^[0-9a-f]{40}$ ]]; then
            sha="$REF"
          else
            sha=$(git ls-remote "https://github.com/$REPOSITORY" "$REF" "$REF^{}" | sort -k2 | tail -n 1 | cut -f1)
          fi
          if [ -z "$sha" ]; then
            echo "::error::$REF not found in $REPOSITORY"
            exit 1
          fi
          git fetch --no-tags origin "+refs/runs/$CONFIG/*:refs/runs/$CONFIG/*"
          skip=false
          if [ "$FORCE" != true ] && python3 scripts/wpt_store.py tested --config "$CONFIG" "$sha"; then
            skip=true
          fi
          {
            echo "sha=$sha"
            echo "skip=$skip"
            echo "chunks=[$(seq -s, 1 "$CHUNKS")]"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build
    needs: check
    if: needs.check.outputs.skip != 'true'
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          repository: ${{ inputs.servo-repository }}
          ref: ${{ needs.check.outputs.sha }}
          persist-credentials: false
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v2.0.0
        with:
          large-packages: false
      - name: Set LIBCLANG_PATH # needed for bindgen in mozangle
        run: echo "LIBCLANG_PATH=/usr/lib/llvm-14/lib" >> "$GITHUB_ENV"
      - uses: ./.github/actions/setup-python
      - uses: ./.github/actions/apt-mirrors
      - name: Bootstrap dependencies
        timeout-minutes: 30
        run: |
          sudo apt update
          ./mach bootstrap --yes --skip-lints --skip-nextest
      - name: Build
        env:
          BUILD_ARGS: ${{ inputs.build-args }}
          QUICKJS: ${{ inputs.quickjs }}
        run: |
          # `--js-engine quickjs` changes Cargo.lock.
          args=(--locked)
          if [ "$QUICKJS" = true ]; then args=(--js-engine quickjs); fi
          # shellcheck disable=SC2086 # BUILD_ARGS holds several arguments
          ./mach build "${args[@]}" --profile release $BUILD_ARGS
      - name: Package
        run: ./mach package --profile release
      - uses: actions/upload-artifact@v7
        with:
          name: servo-${{ inputs.config }}
          path: target/release/servo-tech-demo.tar.gz
          if-no-files-found: error
          retention-days: 3

  wpt:
    name: WPT chunk ${{ matrix.chunk }}
    needs: [check, build]
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        chunk: ${{ fromJSON(needs.check.outputs.chunks) }}
    env:
      GST_PLUGIN_FEATURE_RANK: pulsesink:NONE,alsasink:NONE,jacksink:NONE,fakesink:MAX
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v2.0.0
        with:
          large-packages: false
      - uses: actions/checkout@v6
        with:
          repository: ${{ inputs.servo-repository }}
          ref: ${{ needs.check.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: servo-${{ inputs.config }}
      - name: Unpack servoshell
        run: tar -xzf servo-tech-demo.tar.gz
      - uses: ./.github/actions/setup-python
      - uses: ./.github/actions/apt-mirrors
      - name: Bootstrap dependencies
        timeout-minutes: 30
        run: |
          sudo apt update
          ./mach bootstrap --yes --skip-lints --skip-nextest
          sudo apt install -qy --no-install-recommends mesa-vulkan-drivers fonts-noto-cjk fonts-dejavu-extra
          sudo apt purge -y fonts-droid-fallback
      - name: Run tests
        env:
          CHUNK: ${{ matrix.chunk }}
          CHUNKS: ${{ inputs.chunks }}
          WPT_ARGS: ${{ inputs.wpt-args }}
        run: |
          # shellcheck disable=SC2086 # WPT_ARGS holds several arguments
          ./mach test-wpt \
            --bin servo/servoshell --profile release \
            --processes "$(nproc)" --timeout-multiplier 2 --always-succeed \
            --browser-version "$(servo/servoshell --version)" \
            --total-chunks "$CHUNKS" --this-chunk "$CHUNK" \
            --log-wptreport "wptreport/$CHUNK.json" \
            $WPT_ARGS
      - uses: actions/upload-artifact@v7
        with:
          name: wptreport-${{ inputs.config }}-${{ matrix.chunk }}
          path: wptreport/${{ matrix.chunk }}.json
          if-no-files-found: error
          retention-days: 7

  store:
    name: Store run
    needs: wpt
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          pattern: wptreport-${{ inputs.config }}-*
          path: wptreport
          merge-multiple: true
      - name: Restore the wpt CLI
        id: wpt-cli
        uses: actions/cache@v5
        with:
          path: ~/.cargo/bin/wpt
          key: wpt-cli-${{ env.WPT_CLI_VERSION }}-${{ runner.os }}
      - name: Install the wpt CLI
        if: steps.wpt-cli.outputs.cache-hit != 'true'
        run: cargo install --locked "wpt@$WPT_CLI_VERSION"
      - name: Store and push the run
        env:
          CONFIG: ${{ inputs.config }}
          DATE: ${{ inputs.date }}
          FORCE: ${{ inputs.force }}
        run: |
          force=()
          if [ "$FORCE" = true ]; then force=(--force); fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --no-tags origin "+refs/runs/*:refs/runs/*"
          python3 scripts/wpt_store.py store "${force[@]}" --config "$CONFIG" --date "$DATE" wptreport/*.json
          git push "${force[@]}" origin "refs/runs/$CONFIG/$DATE"
