name: Publish

# Builds the summary of all stored runs and deploys the dashboard to GitHub Pages. store.yml
# starts it after storing runs.
on:
  repository_dispatch:
    types: [runs-stored]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish.yml
      - configs.json
      - scripts/**
      - site/**

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  publish:
    name: Build and deploy the site
    runs-on: ubuntu-24.04
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Fetch stored runs
        run: git fetch --no-tags origin "+refs/runs/*:refs/runs/*"
      - name: Build the site
        run: python3 scripts/wpt_store.py site --out _site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v5
