name: Store WPT results

# Called by the servo-ohos workflows that run WPT: on every ohos-main commit, and nightly on a
# DAYU200 board. Stores the WPT results of the calling workflow run, and those of servo/servo's CI
# for the upstream commit that the revision is based on, as runs of this repository, and then
# starts publish.yml.
#
# The job runs in servo-ohos, in its `servo-ohos-wpt` environment, whose SERVO_OHOS_WPT_TOKEN
# secret is a token with read and write access to the contents of this repository. The caller
# passes the secret by name, which it can although only the environment has it.
on:
  workflow_call:
    inputs:
      artifacts:
        description: 'The WPT artifact of each configuration in the calling run, as {"<config>": "<artifact>"}'
        default: '{"linux-spidermonkey": "wpt-full-logs-linux", "linux-quickjs": "wpt-full-logs-quickjs"}'
        type: string
      chunks:
        description: The number of WPT chunks of a complete run
        default: 20
        type: number
      upstream:
        description: Also store the results of servo/servo's CI for the upstream base, in 20 chunks
        default: true
        type: boolean
    secrets:
      SERVO_OHOS_WPT_TOKEN:
        required: true

env:
  RESULTS_REPOSITORY: openharmony-rs/servo-ohos-wpt
  UPSTREAM_CONFIG: upstream-linux-spidermonkey
  # servo/servo's merge queue runs WPT in 20 chunks.
  UPSTREAM_CHUNKS: 20
  WPT_CLI_VERSION: 0.1.1

jobs:
  store:
    name: Store the WPT results
    runs-on: ubuntu-24.04
    environment: servo-ohos-wpt
    # Artifacts of the calling run download without the token; everything else uses the secret.
    permissions: {}
    steps:
      - uses: actions/checkout@v6
        with:
          repository: ${{ env.RESULTS_REPOSITORY }}
          token: ${{ secrets.SERVO_OHOS_WPT_TOKEN }}
      - uses: actions/download-artifact@v8
        with:
          pattern: wpt-full-logs-*
          path: reports
      - name: Restore the wpt CLI
        id: wpt-cli
        uses: actions/cache@v5
        with:
          path: ~/.cargo/bin/wpt
          key: wpt-cli-${{ env.WPT_CLI_VERSION }}-${{ runner.os }}
      - name: Install the wpt CLI
        if: steps.wpt-cli.outputs.cache-hit != 'true'
        run: cargo install --locked "wpt@$WPT_CLI_VERSION"
      - name: Store and push the runs
        env:
          ARTIFACTS: ${{ inputs.artifacts }}
          CHUNKS: ${{ inputs.chunks }}
          UPSTREAM: ${{ inputs.upstream }}
          REVISION: ${{ github.sha }}
          GH_TOKEN: ${{ secrets.SERVO_OHOS_WPT_TOKEN }}
        run: |
          all_chunks() {
            for chunk in $(seq 1 "$CHUNKS"); do
              [ -s "$1/$chunk.json" ] || return 1
            done
          }
          # download-artifact puts each artifact into a directory named after it only when the
          # pattern matched several. A single one ends up in reports/ itself.
          downloaded=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" \
            --jq '[.artifacts[] | select(.expired | not) | .name | select(startswith("wpt-full-logs-"))]')
          if [ "$(jq length <<< "$downloaded")" -eq 1 ]; then
            single=$(jq -r '.[0]' <<< "$downloaded")
            mv reports "$single"
            mkdir reports
            mv "$single" reports/
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --no-tags origin "+refs/runs/*:refs/runs/*"
          name=$(python3 scripts/wpt_store.py next-name)
          # servo-ohos is a fork of servo/servo, so servo/servo can compare against its commits.
          if ! base=$(gh api "repos/servo/servo/compare/main...$REVISION?per_page=1" --jq .merge_base_commit.sha); then
            echo "::warning::Could not find the servo/servo commit that $REVISION is based on"
            base=""
          fi
          base_args=()
          if [ -n "$base" ]; then base_args=(--base-revision "$base"); fi

          refs=()
          for config in $(jq -r 'keys[]' <<< "$ARTIFACTS"); do
            reports=reports/$(jq -r --arg config "$config" '.[$config]' <<< "$ARTIFACTS")/linux/wptreport
            if python3 scripts/wpt_store.py tested --config "$config" "$REVISION"; then
              continue
            fi
            if ! all_chunks "$reports"; then
              echo "::warning::$config: the WPT results of some of the $CHUNKS chunks are missing, not storing them"
              continue
            fi
            if ! python3 scripts/wpt_store.py store "${base_args[@]}" --config "$config" --name "$name" "$reports"/*.json; then
              echo "::warning::$config: could not store the WPT results"
              continue
            fi
            refs+=("refs/runs/$config/$name")
          done
          if [ "$UPSTREAM" = true ] && [ -n "$base" ] &&
            ! python3 scripts/wpt_store.py tested --config "$UPSTREAM_CONFIG" "$base"; then
            if scripts/upstream_reports.sh "$base" upstream "$UPSTREAM_CHUNKS" &&
              python3 scripts/wpt_store.py store --config "$UPSTREAM_CONFIG" --name "$name" upstream/*.json; then
              refs+=("refs/runs/$UPSTREAM_CONFIG/$name")
            else
              echo "::warning::Could not get the WPT results of the upstream base $base"
            fi
          fi

          if [ ${#refs[@]} -gt 0 ]; then
            git push --atomic origin "${refs[@]}"
            gh api "repos/$RESULTS_REPOSITORY/dispatches" -f event_type=runs-stored
          fi
